<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in — NGO Connect</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="auth-shell">
  <div class="auth-card">
    <h1>Log in</h1>
    <p class="sub">Welcome back.</p>

    <div id="alertBox"></div>

    <form id="loginForm" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required>
      </div>
      <button class="btn btn-primary btn-block" type="submit" id="submitBtn">Log in</button>
    </form>

    <p class="form-note">New here? <a href="signup.html">Register</a></p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script type="module">
  import { supabase } from './js/supabaseClient.js';

  const form = document.getElementById('loginForm');
  const alertBox = document.getElementById('alertBox');
  const submitBtn = document.getElementById('submitBtn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    alertBox.innerHTML = '';
    submitBtn.disabled = true;
    submitBtn.textContent = 'Logging in…';

    const { error } = await supabase.auth.signInWithPassword({
      email: form.email.value.trim(),
      password: form.password.value
    });

    if (error) {
      alertBox.innerHTML = `<div class="alert alert-error">${error.message}</div>`;
      submitBtn.disabled = false;
      submitBtn.textContent = 'Log in';
      return;
    }

    window.location.href = 'dashboard.html';
  });
</script>
</body>
</html>
